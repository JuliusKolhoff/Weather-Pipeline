version: 2

models:
  - name: dim_city
    columns:
      - name: city
        tests: [not_null, unique]

  - name: fact_weather_hourly
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [city, observed_at]
    columns:
      - name: city
        tests:
          - not_null
          - relationships:
              to: ref('dim_city')
              field: city
      - name: observed_at
        tests: [not_null]
      - name: temperature_c
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: -30
              max_value: 45
      - name: humidity_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: precipitation_mm
        tests:
          - dbt_utils.accepted_range:
              min_value: 0